.flt{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}.flt input{grid-column:1/-1}
.bad{color:#dc2626;font-weight:700}.ok{color:var(--a);font-weight:600}textarea{width:100%;min-height:120px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);padding:10px}
@media(min-width:760px){body{padding-bottom:0}nav{position:static;border:0;background:none;padding:0;margin-bottom:16px;gap:6px}nav button{flex-direction:row;font-size:.9rem}nav button b{display:inline;margin-right:6px}.fab{display:none}#toast{bottom:30px}}
@media print{header,nav,footer,.ad,.btn,.ib,.fab,.noprint,.card:has(.form),.total{display:none!important}body{background:#fff;color:#000}.card{box-shadow:none}.chk{accent-color:#000}}
</style>

['🥩','Carnes','Carne,Carne moída,Bife,Picanha,Patinho,Acém,Costela'],['🍗','Carnes','Frango,Peito de frango,Coxa de frango'],['🥓','Carnes','Bacon,Linguiça,Salsicha,Presunto'],['🐟','Carnes','Peixe,Tilápia,Salmão,Sardinha,Atum'],

const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
const ALL=DB.flatMap(([i,c,n])=>n.split(',').map(x=>({n:x,nn:norm(x),i,c})));
function guess(t){t=norm(t);let b=null;for(const e of ALL)if(t.includes(e.nn)&&(!b||e.nn.length>b.nn.length))b=e;return b?[b.i,b.c]:['🛍️','Outros']}
const unitFor=(n,c)=>/ovo/i.test(n)?'bandeja':CU[c]||'un';

const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};

function mk(name,qty,unit,price){const [icon,cat]=guess(name);return{id:uid(),name,qty:qty||1,unit:unit||unitFor(name,cat),price:price||0,icon,cat,done:false}}

function modal(html,ok){const d=$('dlg');d.innerHTML=html+`<div class="row" style="margin-top:14px"><button class="btn g grow" data-x>Cancelar</button><button class="btn grow" data-ok>OK</button></div>`;d.ok=ok;d.showModal();const i=d.querySelector('input,textarea');i&&i.focus()}

const empty=(e,t,s,b)=>`<div class="card" style="text-align:center"><div style="font-size:2.5rem">${e}</div><h2>${t}</h2><p class="mu">${s}</p>${b||''}</div>`;

function itemsHTML(l){const a=sorted(l);if(!l.items.length)return empty('🛒','Sua lista está vazia','Comece adicionando seu primeiro produto.','<button class="btn" data-act="fab">Adicionar produto</button>');if(!a.length)return '<div class="card mu">Nenhum produto neste filtro.</div>';
 let last='',h='<div class="card">';for(const i of a){if(sort==='cat'&&i.cat!==last){h+=`<div class="grp">${i.cat}</div>`;last=i.cat}
 h+=`<div class="item ${i.done?'done':''}"><input type="checkbox" class="chk" data-act="chk" data-id="${i.id}" ${i.done?'checked':''} aria-label="Comprado: ${esc(i.name)}"><div class="ico">${i.icon}</div><div class="grow"><div class="nm"><b>${esc(i.name)}</b> <span class="cat">${i.cat}</span>${i.done?' <span class="mu">✓ comprado</span>':''}</div><div class="mu">${i.qty} ${i.unit}${P.prices&&i.price?` · ${i.qty} × ${money(i.price)} = <b>${money(i.qty*i.price)}</b>`:''}</div></div><button class="ib" data-act="fav" data-id="${i.id}" aria-label="Favorito">${S.favs.includes(i.name)?'⭐':'☆'}</button><button class="ib" data-act="edit" data-id="${i.id}" aria-label="Editar">✏️</button><button class="ib" data-act="rm" data-id="${i.id}" aria-label="Excluir">🗑️</button></div>`}
 return h+(l.items.some(i=>i.done)?'<button class="btn g s" data-act="clear" style="margin-top:10px">Remover comprados</button>':'')+'</div>'}
function listView(){const l=cur();if(!l){view='home';return home()}
 const e=editing&&l.items.find(i=>i.id===editing),t=tot(l.items),b=l.budget;
 const bud=b?`<div class="bar"><div style="width:${Math.min(100,t/b*100)}%;${t>b?'background:#dc2626':''}"></div></div><div class="${t>b?'bad':'ok'}">${t>b?'⚠️ Orçamento excedido em '+money(t-b):'Restante: '+money(b-t)}</div>`:'';
 const d=l.items.filter(i=>i.done).length;
 return `<div class="card"><button class="ib noprint" data-act="go" data-v="lists">← Listas</button><input class="title" id="ln" value="${esc(l.name)}" aria-label="Nome da lista" style="width:100%"><div class="mu">${d} de ${l.items.length} comprados · ${l.items.length-d} pendentes</div>
 <div class="row noprint" style="flex-wrap:wrap;margin-top:10px"><button class="btn g s" data-act="share">Compartilhar</button><button class="btn g s" data-act="copy">Copiar</button><button class="btn g s" data-act="print">🖨️ Imprimir</button><button class="btn g s" data-act="dup" data-id="${l.id}">Duplicar</button></div></div>
 <div class="card"><div class="row"><label class="grow" for="ib"><b>Meu orçamento</b></label><input id="ib" type="number" min="0" step="0.01" inputmode="decimal" placeholder="R$ 0,00" value="${b||''}" style="max-width:140px"></div>${bud}</div>
 <div class="card"><h2>O que você precisa comprar?</h2><div class="form"><div class="ico" id="pv">${e?e.icon:'🛍️'}</div><input id="in" placeholder="Digite um produto..." autocomplete="off" value="${e?esc(e.name):''}" aria-label="Produto"><div class="full chips" id="sg"></div>
 <div class="two"><input id="iq" type="number" min="0.01" step="any" inputmode="decimal" value="${e?e.qty:1}" aria-label="Quantidade"><select id="iu" aria-label="Unidade">${UNITS.map(u=>`<option${e&&e.unit===u?' selected':''}>${u}</option>`).join('')}</select><input id="ip" type="number" min="0" step="0.01" inputmode="decimal" placeholder="R$ preço" value="${e&&e.price?e.price:''}" aria-label="Preço unitário"></div>
 <button class="btn full" data-act="add">${e?'Salvar alterações':'+ Adicionar'}</button></div>
 ${S.favs.length?`<div class="grp">⭐ Meus produtos frequentes</div><div class="chips">${S.favs.map(f=>`<button class="chip" data-act="addfav" data-n="${esc(f)}">${esc(f)}</button>`).join('')}</div>`:''}</div>
 <div class="flt noprint"><input id="sq" type="search" placeholder="🔎 Buscar produto" value="${esc(q)}" aria-label="Buscar produto"><select id="sf" aria-label="Filtro">${[['all','Todos'],['pend','Pendentes'],['done','Comprados']].map(([v,n])=>`<option value="${v}"${filt===v?' selected':''}>${n}</option>`).join('')}</select><select id="ss" aria-label="Ordenar">${[['add','Ordem adicionada'],['cat','Por categoria (auto)'],['name','Por produto'],['price','Por preço'],['pend','Pendentes primeiro'],['done','Comprados primeiro']].map(([v,n])=>`<option value="${v}"${sort===v?' selected':''}>${n}</option>`).join('')}</select></div>
 <div id="items">${itemsHTML(l)}</div><div class="total"><span>${l.items.length} itens · Total</span><span>${money(t)}</span></div>${AD}<button class="fab" data-act="fab" aria-label="Adicionar produto">+</button>`}
function tpls(){return `<div class="card"><h2>📋 Listas prontas</h2><p class="mu">Escolha um modelo e personalize do seu jeito.</p></div>`+TPL.map((t,i)=>`<div class="card"><div class="row"><div class="grow"><b>${t[0]} ${t[1]}</b><div class="mu">${t[2].split(',').join(', ')}</div></div><button class="btn s" data-act="usetpl" data-i="${i}">Usar esta lista</button></div></div>`).join('')+AD}
function tools(){return `<div class="card"><h2>🔥 Calculadora de churrasco</h2><p class="mu">Quantidades aproximadas e geração automática da lista.</p><div class="form"><label class="full">Adultos<input id="ta" type="number" min="0" value="8"></label><label class="full">Crianças<input id="tk" type="number" min="0" value="2"></label><label class="full">Duração (horas)<input id="th" type="number" min="1" value="5"></label><button class="btn full" data-act="bbq">Gerar lista de churrasco</button></div></div>`+AD}
function sett(){return `<div class="card"><h2>🎨 Personalizar aparência</h2><div class="sw">${Object.entries(COLORS).map(([n,c])=>`<button style="background:${c}" class="${P.color===c?'on':''}" data-act="color" data-c="${c}" aria-label="${n}${P.color===c?' (selecionada)':''}"></button>`).join('')}</div><div class="seg">${[['light','Claro'],['dark','Escuro'],['auto','Sistema']].map(([m,t])=>`<button class="btn ${P.mode===m?'':'g'} s" data-act="mode" data-m="${m}" aria-pressed="${P.mode===m}">${t}</button>`).join('')}</div><button class="btn g s" data-act="reset">Restaurar aparência padrão</button></div>
 <div class="card"><h2>Lista</h2><label class="row"><input type="checkbox" class="chk" id="sp" ${P.prices?'checked':''}> Mostrar preços</label><label style="display:block;margin-top:10px">Ordenação padrão<select id="sd">${[['add','Ordem adicionada'],['cat','Por categoria'],['name','Por produto']].map(([v,n])=>`<option value="${v}"${P.sort===v?' selected':''}>${n}</option>`).join('')}</select></label></div>
 <div class="card"><h2>Dados</h2><p class="mu">Suas listas ficam salvas somente neste navegador.</p><div class="row" style="flex-wrap:wrap"><button class="btn g s" data-act="exp">Copiar dados</button><button class="btn g s" data-act="imp">Importar dados</button><button class="btn g s" data-act="wipe">Apagar tudo</button></div></div>`}

const FAQ=[['Como criar uma lista de compras?','Clique em "Criar minha lista", dê um nome e comece a digitar os produtos. O ListaFácil sugere o ícone, a categoria e a unidade automaticamente.'],['Preciso criar uma conta?','Não. Tudo funciona imediatamente, sem cadastro e sem senha.'],['Posso usar a lista pelo celular?','Sim. O site foi pensado primeiro para o celular, com botões grandes e uso confortável com uma mão.'],['As minhas listas ficam salvas?','Sim, no próprio navegador do seu aparelho. Se você limpar os dados do navegador, elas podem ser apagadas; por isso, use "Copiar dados" em Ajustes para fazer um backup.'],['Como controlar o orçamento?','Dentro da lista, informe seu orçamento. O site mostra o quanto ainda resta e avisa quando o total passa do limite.'],['Posso compartilhar minha lista?','Sim. Use o botão Compartilhar (ou Copiar) e envie o texto da lista por WhatsApp, e-mail ou onde preferir. Também é possível imprimir.'],['Como salvar minha lista?','Ela é salva automaticamente a cada alteração. Você também pode duplicar listas recorrentes, como a compra do mês.']];
function land(){return `<section class="hero2"><h1>Sua lista de compras, muito mais inteligente.</h1><p>Organize suas compras, controle seus gastos e nunca mais esqueça o que precisa levar para casa.</p><button class="btn" data-act="new" style="min-height:54px;font-size:1.1rem">Criar minha lista</button><div class="mu" style="margin-top:8px">Grátis · Sem cadastro · Funciona no celular</div></section>
<div class="card" aria-label="Demonstração"><b>🛒 Compras da Semana</b><div class="bar"><div style="width:66%"></div></div><div class="item"><input type="checkbox" class="chk" checked disabled aria-label="exemplo"><div class="ico">🥛</div><div class="grow"><b>Leite</b><div class="mu">2 un · R$ 9,98</div></div></div><div class="item"><input type="checkbox" class="chk" checked disabled aria-label="exemplo"><div class="ico">🍌</div><div class="grow"><b>Banana</b><div class="mu">1 kg · R$ 6,99</div></div></div><div class="item"><input type="checkbox" class="chk" disabled aria-label="exemplo"><div class="ico">🥚</div><div class="grow"><b>Ovos</b><div class="mu">1 bandeja · R$ 14,90</div></div></div></div>
<h2 style="margin-top:22px">Tudo o que você precisa</h2><div class="feat">${[['🛒','Lista inteligente','Ícones, categorias e sugestões automáticas ao digitar.'],['💰','Controle de gastos','Preços, total e orçamento com aviso visual.'],['⭐','Produtos favoritos','Adicione seus itens frequentes em um toque.'],['🎨','Personalização','8 cores e modo claro ou escuro.'],['🖨️','Imprima e compartilhe','Envie a lista ou leve no papel.'],['📱','Funciona no celular','Rápido, leve e sem instalar nada.']].map(f=>`<div class="card"><div style="font-size:1.8rem">${f[0]}</div><b>${f[1]}</b><div class="mu">${f[2]}</div></div>`).join('')}</div>
<div class="card"><h2>🧮 Ferramentas gratuitas</h2><p class="mu">Calcule quanto comprar para um churrasco e gere a lista pronta.</p><button class="btn g s" data-act="go" data-v="tools">Abrir calculadora de churrasco</button></div>
<div class="card"><h2>📋 Listas prontas</h2><div class="chips">${TPL.map((t,i)=>`<button class="chip" data-act="usetpl" data-i="${i}">${t[0]} ${t[1]}</button>`).join('')}</div></div>
<div class="card"><h2>Perguntas frequentes</h2>${FAQ.map(f=>`<details><summary>${f[0]}</summary><p>${f[1]}</p></details>`).join('')}</div>${AD}
<div class="card hero" style="text-align:center"><h2 style="font-size:1.4rem">Pronto para comprar sem esquecer nada?</h2><button class="btn" data-act="new">Criar minha lista</button></div>`}
const doc=(t,b)=>`<div class="card doc"><button class="ib" data-act="go" data-v="land">← Início</button><h1 style="margin:6px 0">${t}</h1><p class="mu">Última atualização: 6 de outubro de 2026</p>${b}</div>`;
const priv=()=>doc('Política de Privacidade',`<p>Esta política explica como o ListaFácil trata informações quando você usa o site.</p><h2>1. Dados das suas listas</h2><p>Suas listas, produtos, preços, favoritos e preferências de aparência são armazenados <b>apenas no seu navegador</b> (localStorage). Não exigimos cadastro e não enviamos o conteúdo das suas listas para nossos servidores.</p><h2>2. Cookies e publicidade</h2><p>O site poderá exibir anúncios do Google AdSense. O Google e seus parceiros podem usar cookies e identificadores para exibir anúncios com base em visitas anteriores a este e a outros sites. Você pode gerenciar a personalização de anúncios em <b>g.co/adsettings</b> e saber mais em <b>policies.google.com/technologies/ads</b>. Onde exigido, solicitaremos seu consentimento.</p><h2>3. Métricas de uso</h2><p>Podemos usar ferramentas de análise para entender o desempenho do site, sempre de forma agregada.</p><h2>4. Seus direitos (LGPD)</h2><p>Você pode apagar seus dados a qualquer momento em Ajustes › Apagar tudo, ou limpando os dados do navegador. Para dúvidas sobre privacidade, fale conosco na página de Contato.</p><h2>5. Alterações</h2><p>Esta política pode ser atualizada; a data de revisão aparece no topo da página.</p>`);
const terms=()=>doc('Termos de Uso',`<p>Ao usar o ListaFácil, você concorda com estes termos.</p><h2>1. O serviço</h2><p>O ListaFácil é uma ferramenta gratuita para criar e organizar listas de compras, fornecida "como está".</p><h2>2. Seus dados</h2><p>As listas ficam salvas no seu navegador. Você é responsável por fazer backup (Ajustes › Copiar dados). Podemos não conseguir recuperar listas apagadas.</p><h2>3. Uso adequado</h2><p>Não use o site para fins ilegais, nem tente comprometer seu funcionamento ou segurança.</p><h2>4. Valores e cálculos</h2><p>Totais, orçamentos e quantidades sugeridas (como na calculadora de churrasco) são estimativas e não garantem preços ou consumo reais.</p><h2>5. Publicidade</h2><p>O site pode exibir anúncios de terceiros, que não são de nossa responsabilidade.</p><h2>6. Limitação de responsabilidade</h2><p>Não nos responsabilizamos por perdas decorrentes do uso do serviço, na máxima extensão permitida pela lei.</p><h2>7. Alterações</h2><p>Os termos podem ser atualizados a qualquer momento. O uso contínuo indica concordância.</p>`);
const about=()=>doc('Sobre o ListaFácil',`<p>O ListaFácil nasceu para tornar as compras do dia a dia mais simples: uma lista rápida, bonita e útil, sem cadastro e sem complicação.</p><p>Nosso objetivo é ajudar você a organizar o que precisa comprar, acompanhar quanto vai gastar e economizar tempo, seja no supermercado, em um churrasco ou numa viagem.</p><button class="btn" data-act="new">Criar minha lista</button>`);
const contact=()=>doc('Contato',`<p>Dúvidas, sugestões ou problemas? Escreva para nós:</p><p><b>seu-email@exemplo.com</b></p><p>Respondemos assim que possível.</p>`);
(()=>{const j=document.createElement('script');j.type='application/ld+json';j.textContent=JSON.stringify({'@context':'https://schema.org','@type':'FAQPage',mainEntity:FAQ.map(f=>({'@type':'Question',name:f[0],acceptedAnswer:{'@type':'Answer',text:f[1]}}))});document.head.appendChild(j)})();
function render(){const V={land,home,lists,list:listView,tpl:tpls,tools,set:sett,priv,terms,about,contact};$('app').innerHTML=V[view]();
 $('nav').innerHTML=[['home','🏠','Painel'],['lists','🛒','Listas'],['tpl','📋','Modelos'],['tools','🧮','Ferramentas'],['set','⚙️','Ajustes']].map(([v,i,t])=>`<button data-act="go" data-v="${v}" class="${view===v||(view==='list'&&v==='lists')?'on':''}" ${view===v?'aria-current="page"':''}><b>${i}</b>${t}</button>`).join('');
 const g=i=>$(i);if(g('in')){const l=cur(),up=()=>{const v=g('in').value,n=norm(v);g('pv').textContent=guess(v)[0];g('sg').innerHTML=n.length<2?'':ALL.filter(e=>e.nn.includes(n)).sort((a,b)=>b.nn.startsWith(n)-a.nn.startsWith(n)).slice(0,5).map(e=>`<button class="chip" data-act="sug" data-n="${esc(e.n)}">${e.i} ${e.n}</button>`).join('')};g('in').oninput=up;
  g('sq').oninput=e=>{q=e.target.value;g('items').innerHTML=itemsHTML(l)};g('sf').onchange=e=>{filt=e.target.value;g('items').innerHTML=itemsHTML(l)};g('ss').onchange=e=>{sort=e.target.value;g('items').innerHTML=itemsHTML(l)};
  g('ib').onchange=e=>{l.budget=parseFloat(e.target.value)||0;persist();render()};g('ln').onchange=e=>{l.name=e.target.value.trim()||'Minha lista';persist()}}
 if(g('sp')){g('sp').onchange=e=>{P.prices=e.target.checked;applyPrefs()};g('sd').onchange=e=>{P.sort=sort=e.target.value;applyPrefs()}}}
function open(id){S.cur=id;view='list';editing=null;q='';filt='all';sort=P.sort;persist()}
function addItem(o){const l=cur();if(editing){Object.assign(l.items.find(i=>i.id===editing),o);editing=null;toast('✓ Produto atualizado')}else{l.items.push(o);toast('✓ Produto adicionado')}persist()}
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t||t.closest('dialog'))return;const a=t.dataset.act,id=t.dataset.id,l=cur(),D=t.dataset;
 if(a==='go'){view=D.v;editing=null;window.scrollTo(0,0)}
 else if(a==='open')open(id)
 else if(a==='new')return modal('<h2>Nova lista</h2><input value="Nova lista" aria-label="Nome">',v=>{const x=mkList(v.trim()||'Nova lista');S.lists.push(x);open(x.id);render()})
 else if(a==='ren'){e.stopPropagation();const x=S.lists.find(x=>x.id===id);return modal('<h2>Renomear lista</h2><input value="'+esc(x.name)+'">',v=>{x.name=v.trim()||x.name;persist();render()})}
 else if(a==='dup'){e.stopPropagation();const x=S.lists.find(x=>x.id===id),c={...mkList(x.name+' - cópia',x.items.map(i=>({...i,id:uid(),done:false}))),budget:x.budget};S.lists.push(c);persist();toast('Lista duplicada');if(view==='list')open(c.id)}
 else if(a==='arc'){e.stopPropagation();const x=S.lists.find(x=>x.id===id);x.archived=!x.archived;persist();toast(x.archived?'Lista arquivada':'Lista restaurada')}
 else if(a==='del'){e.stopPropagation();return modal('<h2>Excluir esta lista?</h2><p class="mu">Essa ação não pode ser desfeita.</p>',()=>{S.lists=S.lists.filter(x=>x.id!==id);S.cur=(S.lists.find(x=>!x.archived)||{}).id;persist();toast('Lista removida');render()})}
 else if(a==='usetpl'){const T=TPL[+D.i],x=mkList(T[0]+' '+T[1],T[2].split(',').map(n=>mk(n)));S.lists.push(x);open(x.id);toast('Lista criada!')}
 else if(a==='sug'){const i=document.getElementById('in');i.value=D.n;const [ic,c]=guess(D.n);$('pv').textContent=ic;$('iu').value=unitFor(D.n,c);$('sg').innerHTML='';i.focus();return}
 else if(a==='add'){const n=$('in').value.trim();if(!n){$('in').focus();return}const o=mk(n,parseFloat($('iq').value),$('iu').value,parseFloat($('ip').value));if(editing){const old=l.items.find(i=>i.id===editing);o.id=old.id;o.done=old.done}addItem(o)}
 else if(a==='addfav'){l.items.push(mk(D.n));persist();toast('✓ '+D.n+' adicionado')}
 else if(a==='fab'){const i=$('in');if(i){i.scrollIntoView({behavior:'smooth',block:'center'});i.focus()}return}
 else if(a==='edit'){editing=id;render();$('in').focus();return}
 else if(a==='fav'){const n=l.items.find(i=>i.id===id).name;S.favs=S.favs.includes(n)?S.favs.filter(x=>x!==n):[...S.favs,n];persist()}
 else if(a==='rm'){l.items=l.items.filter(i=>i.id!==id);persist();toast('Produto removido')}
 else if(a==='chk'){l.items.find(i=>i.id===id).done=t.checked;persist();if(l.items.every(i=>i.done))toast('🎉 Lista concluída!')}
 else if(a==='clear'){l.items=l.items.filter(i=>!i.done);persist()}
 else if(a==='copy')return copy(text(l),'Lista copiada!')
 else if(a==='print')return window.print()
 else if(a==='share'){if(navigator.share)navigator.share({title:l.name,text:text(l)}).catch(()=>{});else copy(text(l),'Lista copiada!');return}
 else if(a==='bbq'){const ad=+$('ta').value||0,k=+$('tk').value||0,h=+$('th').value||4,p=ad+k*.5,f=h>5?1.2:1,r=x=>Math.max(.5,Math.round(x*2)/2);
  const it=[mk('Carne',r(p*.4*f),'kg'),mk('Linguiça',r(p*.15*f),'kg'),mk('Frango',r(p*.15*f),'kg'),mk('Pão de alho',Math.ceil(p*1.5),'un'),mk('Carvão',r(p*.5),'kg'),mk('Cerveja',r(ad*1.5*f),'L'),mk('Refrigerante',r(p*.7),'L'),mk('Gelo',Math.ceil(p),'kg'),mk('Sal grosso',1,'pacote')];
  const x=mkList('🔥 Churrasco ('+ad+' adultos, '+k+' crianças)',it);S.lists.push(x);open(x.id);toast('Lista gerada!')}
 else if(a==='color'){P.color=D.c;applyPrefs()}else if(a==='mode'){P.mode=D.m;applyPrefs()}else if(a==='reset'){P={...P,color:'#2563eb',mode:'auto'};applyPrefs();toast('Aparência restaurada')}
 else if(a==='exp')return copy(JSON.stringify({S,P}),'Dados copiados! Cole em um local seguro.')
 else if(a==='imp')return modal('<h2>Importar dados</h2><textarea aria-label="Dados"></textarea>',v=>{try{const o=JSON.parse(v);S=o.S;P=o.P;S.favs=S.favs||[];persist();applyPrefs();toast('Dados importados');render()}catch(x){toast('Dados inválidos')}})
 else if(a==='wipe')return modal('<h2>Tem certeza?</h2><p class="mu">Todas as listas e preferências serão apagadas.</p>',()=>{S={lists:[],cur:null,favs:[]};persist();toast('Dados apagados');view='home';render()});
 render()});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&['in','iq','ip'].includes(e.target.id))document.querySelector('[data-act="add"]').click()});
applyPrefs();render();
</script>
</body>
