<style>
:root{--a:#2563eb;--bg:#f5f7fb;--card:#fff;--tx:#0f172a;--mu:#64748b;--bd:#e2e8f0;--sh:0 4px 18px rgba(15,23,42,.07);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1120;--card:#151e32;--tx:#f1f5f9;--mu:#94a3b8;--bd:#25314d;--sh:0 4px 18px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#0b1120;--card:#151e32;--tx:#f1f5f9;--mu:#94a3b8;--bd:#25314d;--sh:0 4px 18px rgba(0,0,0,.4)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:16px}
.logo{font-weight:800;font-size:1.3rem;display:flex;gap:8px;align-items:center;cursor:pointer}
.logo i img{display:block}.logo i{font-style:normal;background:var(--a);color:#fff;border-radius:12px;padding:6px;line-height:0}
.btn{border:0;border-radius:14px;min-height:46px;padding:0 18px;background:var(--a);color:#fff;font-weight:600;cursor:pointer;transition:transform .12s,opacity .2s}
.btn:active{transform:scale(.97)}.btn.g{background:var(--card);color:var(--tx);border:1px solid var(--bd)}.btn.s{min-height:38px;padding:0 12px;border-radius:12px}
.card{background:var(--card);border-radius:20px;box-shadow:var(--sh);padding:18px;margin-bottom:14px;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--card);border-radius:18px;padding:14px;box-shadow:var(--sh)}.stat b{display:block;font-size:1.3rem;color:var(--a)}.stat span{color:var(--mu);font-size:.85rem}
h2{margin:0 0 10px;font-size:1.1rem}.mu{color:var(--mu);font-size:.9rem}
.hero{background:linear-gradient(135deg,var(--a),color-mix(in srgb,var(--a) 60%,#000));color:#fff}.hero .btn{background:#fff;color:var(--a);margin-top:12px}
.row{display:flex;gap:10px;align-items:center}.grow{flex:1;min-width:0}
.lrow{padding:12px 0;border-bottom:1px solid var(--bd);cursor:pointer}.lrow:last-child{border:0}
.bar{height:8px;background:var(--bd);border-radius:9px;overflow:hidden;margin:8px 0}.bar div{height:100%;background:var(--a);transition:width .3s}
.form{display:grid;grid-template-columns:auto 1fr;gap:10px}.form .full{grid-column:1/-1}.form .two{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;grid-column:1/-1}
input,select{width:100%;min-height:46px;border:1px solid var(--bd);background:var(--bg);border-radius:12px;padding:0 12px}
input:focus,select:focus,.btn:focus-visible{outline:3px solid color-mix(in srgb,var(--a) 40%,transparent);outline-offset:1px}
.ico{font-size:1.7rem;width:46px;height:46px;display:grid;place-items:center;background:var(--bg);border-radius:12px}
.item{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd)}.item:last-child{border:0}
.item.done .nm{text-decoration:line-through;opacity:.5}
.chk{width:28px;height:28px;accent-color:var(--a);min-height:0;flex:none}
.cat{font-size:.72rem;background:color-mix(in srgb,var(--a) 14%,transparent);color:var(--a);border-radius:9px;padding:1px 8px}
.ib{border:0;background:none;font-size:1.1rem;padding:8px;cursor:pointer;border-radius:10px}.ib:hover{background:var(--bg)}
.total{position:sticky;bottom:10px;background:var(--a);color:#fff;border-radius:18px;padding:14px 18px;display:flex;justify-content:space-between;box-shadow:var(--sh);font-weight:700}
dialog{border:0;border-radius:22px;background:var(--card);color:var(--tx);width:min(92vw,420px);padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(0,0,0,.5)}
.sw{display:flex;flex-wrap:wrap;gap:12px;margin:10px 0 16px}.sw button{width:44px;height:44px;border-radius:50%;border:3px solid transparent;cursor:pointer}.sw button.on{border-color:var(--tx)}
.seg{display:flex;gap:6px;margin-bottom:16px}.seg .btn{flex:1}
.ad{border:1px dashed var(--bd);border-radius:14px;text-align:center;color:var(--mu);font-size:.75rem;padding:22px;margin:14px 0}
.title{font-size:1.4rem;font-weight:800;border:0;background:none;padding:0;min-height:0}
footer{text-align:center;color:var(--mu);font-size:.8rem;padding:20px 0}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
body{padding-bottom:84px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--card);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;border:0;background:none;border-radius:12px;padding:6px 2px;font-size:.72rem;color:var(--mu);cursor:pointer;min-height:48px}
nav button b{display:block;font-size:1.2rem;font-weight:400}nav button.on{color:var(--a);font-weight:700;background:color-mix(in srgb,var(--a) 12%,transparent)}
.hero2{text-align:center;padding:28px 8px}.hero2 h1{font-size:clamp(1.8rem,6vw,2.8rem);line-height:1.15;margin:0 0 12px}.hero2 p{color:var(--mu);max-width:520px;margin:0 auto 18px}.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:14px}.feat .card{margin:0}details{border-bottom:1px solid var(--bd);padding:12px 0}summary{cursor:pointer;font-weight:600;min-height:32px}details p{margin:8px 0 0;color:var(--mu)}.doc h2{margin-top:20px}.doc p,.doc li{color:var(--mu)}footer button{color:var(--mu);cursor:pointer;margin:0 6px;text-decoration:underline;background:none;border:0;min-height:36px}footer a{color:var(--mu);cursor:pointer;margin:0 8px;text-decoration:underline;background:none;border:0}.fab{position:fixed;right:16px;bottom:92px;width:56px;height:56px;border-radius:50%;border:0;background:var(--a);color:#fff;font-size:1.8rem;box-shadow:var(--sh);cursor:pointer;z-index:15}
#toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%) translateY(20px);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:14px;opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:90vw;text-align:center}#toast.show{opacity:1;transform:translateX(-50%)}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{border:1px solid var(--bd);background:var(--bg);border-radius:20px;padding:6px 12px;cursor:pointer;min-height:38px}
.chip:hover{border-color:var(--a)}.grp{font-size:.8rem;font-weight:700;color:var(--mu);margin:12px 0 2px;text-transform:uppercase}

const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
const ALL=DB.flatMap(([i,c,n])=>n.split(',').map(x=>({n:x,nn:norm(x),i,c})));
function guess(t){t=norm(t);let b=null;for(const e of ALL)if(t.includes(e.nn)&&(!b||e.nn.length>b.nn.length))b=e;return b?[b.i,b.c]:['🛍️','Outros']}
const unitFor=(n,c)=>/ovo/i.test(n)?'bandeja':CU[c]||'un';
const TPL=[['🏠','Compras mensal','Arroz,Feijão,Macarrão,Óleo,Café,Açúcar,Leite,Ovos,Sal,Farinha,Papel higiênico,Sabão em pó,Detergente,Sabonete'],['🔥','Churrasco','Carne,Linguiça,Frango,Pão de alho,Carvão,Sal grosso,Cerveja,Refrigerante,Gelo,Guardanapo'],['🎉','Festa','Refrigerante,Salgadinho,Chocolate,Bolo,Copos descartáveis,Pratos descartáveis,Guardanapo,Gelo,Suco'],['🏖️','Viagem','Água,Biscoito,Shampoo,Protetor solar,Medicamento,Escova de dente,Creme dental,Sabonete'],['📦','Casa nova','Detergente,Esponja,Vassoura,Saco de lixo,Papel higiênico,Sabão em pó,Amaciante,Sabonete,Lâmpada']];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const uid=()=>Math.random().toString(36).slice(2,9),$=i=>document.getElementById(i);
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
function mk(name,qty,unit,price){const [icon,cat]=guess(name);return{id:uid(),name,qty:qty||1,unit:unit||unitFor(name,cat),price:price||0,icon,cat,done:false}}
const mkList=(name,items)=>({id:uid(),name,budget:0,archived:false,items:items||[]});
let S=load('lf_state',null)||{lists:[{...mkList('Compras da Semana',[mk('Leite',2,'un',4.99),mk('Banana',1,'kg',6.99)]),id:'l1'}],cur:'l1'};S.favs=S.favs||[];
let P=Object.assign({color:'#2563eb',mode:'auto',sort:'add',prices:true},load('lf_prefs',{}));
let view=load('lf_seen',false)&&S.lists.length?'home':'land';save('lf_seen',true);let _v,editing=null,filt='all',q='',sort=P.sort;
const persist=()=>save('lf_state',S),cur=()=>S.lists.find(l=>l.id===S.cur)||S.lists.find(l=>!l.archived);
const tot=(it,f=()=>true)=>it.filter(f).reduce((s,i)=>s+i.qty*(i.price||0),0);
function applyPrefs(){const r=document.documentElement;r.style.setProperty('--a',P.color);P.mode==='auto'?r.removeAttribute('data-theme'):r.setAttribute('data-theme',P.mode);save('lf_prefs',P)}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t.t);t.t=setTimeout(()=>t.classList.remove('show'),2200)}
function modal(html,ok){const d=$('dlg');d.innerHTML=html+`<div class="row" style="margin-top:14px"><button class="btn g grow" data-x>Cancelar</button><button class="btn grow" data-ok>OK</button></div>`;d.ok=ok;d.showModal();const i=d.querySelector('input,textarea');i&&i.focus()}
$('dlg').addEventListener('click',e=>{const d=$('dlg');if(e.target.closest('[data-ok]')){const i=d.querySelector('input,textarea');d.close();d.ok&&d.ok(i?i.value:'')}else if(e.target.closest('[data-x]')||e.target===d)d.close()});
function text(l){return l.name+'\n'+l.items.map(i=>`${i.done?'[x]':'[ ]'} ${i.icon} ${i.name} – ${i.qty} ${i.unit}${i.price?' – '+money(i.qty*i.price):''}`).join('\n')+'\nTotal: '+money(tot(l.items))}
const copy=(t,m)=>navigator.clipboard?navigator.clipboard.writeText(t).then(()=>toast(m||'Copiado!'),()=>toast('Não foi possível copiar')):toast('Cópia indisponível');
const empty=(e,t,s,b)=>`<div class="card" style="text-align:center"><div style="font-size:2.5rem">${e}</div><h2>${t}</h2><p class="mu">${s}</p>${b||''}</div>`;
const AD='<div class="ad" aria-label="Espaço publicitário">Espaço para anúncio</div>';
function home(){const L=S.lists.filter(l=>!l.archived),all=L.flatMap(l=>l.items),c=cur();
 const d=c?c.items.filter(i=>i.done).length:0,n=c?c.items.length:0;
 const msg=!c||!n?'Comece adicionando seu primeiro produto.':d===n?'🎉 Tudo comprado!':`Você já comprou ${d} de ${n} produtos. Faltam ${n-d}.`;
 return `<div class="stats"><div class="stat"><b>${L.length}</b><span>Listas</span></div><div class="stat"><b>${all.filter(i=>i.done).length}</b><span>Comprados</span></div><div class="stat"><b>${all.filter(i=>!i.done).length}</b><span>Pendentes</span></div><div class="stat"><b>${money(tot(all))}</b><span>Estimado</span></div><div class="stat"><b>${money(tot(all,i=>i.done))}</b><span>Gasto</span></div></div>`+

  const it=[mk('Carne',r(p*.4*f),'kg'),mk('Linguiça',r(p*.15*f),'kg'),mk('Frango',r(p*.15*f),'kg'),mk('Pão de alho',Math.ceil(p*1.5),'un'),mk('Carvão',r(p*.5),'kg'),mk('Cerveja',r(ad*1.5*f),'L'),mk('Refrigerante',r(p*.7),'L'),mk('Gelo',Math.ceil(p),'kg'),mk('Sal grosso',1,'pacote')];
  const x=mkList('🔥 Churrasco ('+ad+' adultos, '+k+' crianças)',it);S.lists.push(x);open(x.id);toast('Lista gerada!')}
 else if(a==='color'){P.color=D.c;applyPrefs()}else if(a==='mode'){P.mode=D.m;applyPrefs()}else if(a==='reset'){P={...P,color:'#2563eb',mode:'auto'};applyPrefs();toast('Aparência restaurada')}
 else if(a==='exp')return copy(JSON.stringify({S,P}),'Dados copiados! Cole em um local seguro.')
 else if(a==='imp')return modal('<h2>Importar dados</h2><textarea aria-label="Dados"></textarea>',v=>{try{const o=JSON.parse(v);S=o.S;P=o.P;S.favs=S.favs||[];persist();applyPrefs();toast('Dados importados');render()}catch(x){toast('Dados inválidos')}})
 else if(a==='wipe')return modal('<h2>Tem certeza?</h2><p class="mu">Todas as listas e preferências serão apagadas.</p>',()=>{S={lists:[],cur:null,favs:[]};persist();toast('Dados apagados');view='home';render()});
 render()});
